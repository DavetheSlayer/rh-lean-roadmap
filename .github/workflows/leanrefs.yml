name: leanrefs
on:
  pull_request:
    paths: ['docs/src/book/**', 'scripts/**', '.github/workflows/leanrefs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TomasOrtega/RH
          ref: a6ac91a412dcbaab31801355ec5707024a71bf65  # Lean archive the book cites; bump together with the book
          path: RH
          sparse-checkout: extracted/lean/src
          fetch-depth: 1
          persist-credentials: false
      - run: python3 scripts/test_check_leanrefs.py
      - run: python3 scripts/check_leanrefs.py RH/extracted/lean/src --skip-mathlib
